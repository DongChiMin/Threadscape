<!doctype html><meta charset="utf-8"><title>stitch preview</title>
<style>body{background:#3a2c22;color:#eee;font:13px sans-serif;margin:8px}canvas{display:block;margin:4px 0}.row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}</style>
<div id="out"></div>
<script src="/logic.js"></script>
<script>
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const css=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function hash(x,y){let h=(x*374761393+y*668265263)>>>0;h=(h^(h>>>13))*1274126177>>>0;return((h^(h>>>16))>>>0)/4294967296}
function flat(g,col,x,y,s){const x0=Math.round(x),y0=Math.round(y);g.fillStyle=col;g.fillRect(x0,y0,Math.round(x+s)-x0,Math.round(y+s)-y0)}
// cross-stitch: fabric gap (darkened thread colour), under-leg "\", over-leg "/" with a sheen line
function stitch(g,col,x,y,s,ix,iy){const c=hexRgb(col),j=(hash(ix,iy)-.5)*.10,base=j>0?mix(c,[255,255,255],j):mix(c,[0,0,0],-j);
 const dark=mix(base,[20,12,6],.30),mid=mix(base,[20,12,6],.12),hi=mix(base,[255,250,235],.16);
 const x0=Math.round(x),y0=Math.round(y),w=Math.round(x+s)-x0,h=Math.round(y+s)-y0;
 g.fillStyle=css(dark);g.fillRect(x0,y0,w,h);
 if(s<3){g.fillStyle=css(base);g.fillRect(x0,y0,w,h);return}
 const p=s*.13,lw=s*.40;g.lineCap='round';
 g.strokeStyle=css(mid);g.lineWidth=lw;g.beginPath();g.moveTo(x+p,y+p);g.lineTo(x+s-p,y+s-p);g.stroke();
 g.strokeStyle=css(base);g.beginPath();g.moveTo(x+s-p,y+p);g.lineTo(x+p,y+s-p);g.stroke();
 if(s>=6){g.strokeStyle=css(hi);g.lineWidth=Math.max(.7,s*.07);g.beginPath();g.moveTo(x+s-p*1.6,y+p*2.4);g.lineTo(x+p*2.4,y+s-p*1.6);g.stroke()}}
function render(p,S,fn){const hr=Logic.decodeHires(p),W=hr.w,H=hr.h,s=S/W,c=document.createElement('canvas');c.width=S;c.height=Math.round(H*s);const g=c.getContext('2d');g.fillStyle=p.background;g.fillRect(0,0,c.width,c.height);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const col=hr.colorAt(x,y);if(col)fn(g,col,x*s,y*s,s,x,y)}return c}
const pics=Logic.makePictures(),out=document.getElementById('out');
const id=new URLSearchParams(location.search).get('id')||'cottage',p=pics.find(q=>q.id===id);
const S=+(new URLSearchParams(location.search).get('s')||8);const W=Logic.decodeHires(p).w*S;
const row=document.createElement('div');row.className='row';out.append(row);
const M=new URLSearchParams(location.search).get('m');for(const [n,fn] of [['flat',flat],['stitch',stitch]].filter(e=>!M||e[0]===M)){const d=document.createElement('div');d.textContent=n+' '+S+'px/stitch';d.append(render(p,W,fn));row.append(d)}
</script>

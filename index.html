<script>

// BEGIN PURE LOGIC
const Logic=(()=>{
 // Pure game logic (no DOM). Source of truth; `node build.js` splices it into index.html.
 const COLORS='RGBYVPONTK'; // R coral, G leaf, B sky, Y sunflower, V violet, P pink, O orange, N brown, T teal, K charcoal
 const DIFFICULTY=[ // tunable: spools per color (kmin..kmax), min spool length, anchors/holes, candidates tried
  {to:5, minLen:2,prefLen:2,kmin:1,kmax:1,pre:0,   torn:0,cands:6},
  {to:15,minLen:2,prefLen:2,kmin:1,kmax:2,pre:.12, torn:0,cands:40},  // spec says 2-3 spools/color; bot showed that is too trap-heavy

 const DEAD=new Set(); // known-unsolvable (w,cells,lengths) states; adjacency depends only on w, so it is level-independent

 // all simple paths of exactly L cells that END at s (s is the first cell)
 function enumFrom(A,rem,s,L,cb){const vis=new Uint8Array(rem.length),path=[s];vis[s]=1;let stop=false;

   for(const n of A[last])if(rem[n]&&!vis[n]){vis[n]=1;armB.push(n);walkB(n,need-1);armB.pop();vis[n]=0;if(stop)return}};
  const walkA=(last,a)=>{if(stop)return;const b=L-1-a;if(a<=b)walkB(c,b);if(a>=b)return;
   for(const n of A[last])if(rem[n]&&!vis[n]){vis[n]=1;armA.push(n);walkA(n,a+1);armA.pop();vis[n]=0;if(stop)return}};

   for(let k=0;k<ls.length;k++){const L=ls[k];if(L===prev)continue;prev=L;const next=without(ls,k);let found=false;

 // ---- difficulty bot ----
 // Models a player who can see dead ends (backtracks for free) but cannot foresee global solvability:
 // picks a random spool, finds some complete path by randomized DFS, commits, loses a heart if rejected.
 function randomPath(state,spool,rng){const {level}=state,A=adj(level.w,level.h),cs=remaining(state,spool.color),rem=new Uint8Array(level.w*level.h);cs.forEach(c=>rem[c]=1);
  for(let i=cs.length-1;i>0;i--){const j=rng()*(i+1)|0;[cs[i],cs[j]]=[cs[j],cs[i]]}
  for(const s of cs){const vis=new Uint8Array(rem.length),path=[s];vis[s]=1;let steps=0;
   const go=()=>{if(path.length===spool.length)return true;if(++steps>3000)return false;const nx=A[path[path.length-1]].filter(n=>rem[n]&&!vis[n]);
    for(let i=nx.length-1;i>0;i--){const j=rng()*(i+1)|0;[nx[i],nx[j]]=[nx[j],nx[i]]}

 function parseLevel(name,rows,number){const w=Math.max(...rows.map(r=>r.length)),cells=[];for(const row of rows)for(let c=0;c<w;c++){const ch=row[c]||'.';cells.push(COLORS.includes(ch)||ch==='#'?ch:'.')}

 // randomized self-avoiding walks (Warnsdorff-style) that tile one color's cells; null if min length cannot be met

   const deg=c=>{let d=0;for(const j of A[c])if(left.has(j))d++;return d};

 for(let guard=0;guard<8&&parked;guard++){let ax=Math.abs(stepAcc.x),ay=Math.abs(stepAcc.y),horiz=ax>=ay;if((horiz?ax:ay)<T)break;
  let head=parked.path.at(-1),w=level.w,col=head%w,row=head/w|0,tc=col+(horiz?Math.sign(stepAcc.x):0),tr=row+(horiz?0:Math.sign(stepAcc.y)),target=tc>=0&&tr>=0&&tc<w&&tr<level.h?tr*w+tc:-1,before=parked.path.length;
  if(target>=0)enterCell(target);
  let moved=!parked||parked.path.length!==before||parked.path.at(-1)===target;
  if(moved){if(horiz){stepAcc.x-=Math.sign(stepAcc.x)*T;stepAcc.y*=.25}else{stepAcc.y-=Math.sign(stepAcc.y)*T;stepAcc.x*=.25}}
  else{if(horiz)stepAcc.x=Math.sign(stepAcc.x)*(T-1);else stepAcc.y=Math.sign(stepAcc.y)*(T-1);break}}}
setInterval(()=>{if(dragging&&parked&&rewHover&&!rewinding&&performance.now()-rewHover>=140)setRewind(true)},50);
canvas.addEventListener('pointerdown',e=>{if(screen!=='game'||DEMO||cutMode)return;audio.init();canvas.setPointerCapture(e.pointerId);dragging=true;lastAction=performance.now();inputType=e.pointerType;stepAcc={x:0,y:0};lastFinger={x:e.clientX,y:e.clientY};
 tapInfo={t:performance.now(),x:e.clientX,y:e.clientY,head:false,start:false,moved:false};
 lastPointer={x:e.clientX,y:e.clientY,t:performance.now()};needle.px=e.clientX+24;needle.py=e.clientY-48;if(!parked){needle.x=needle.px;needle.y=needle.py;needle.vx=needle.vy=0}
 let ci=pointerCell(e.clientX,e.clientY);
 if(parked){let P=parked.path,head=P.at(-1),bl=badgeLayout(),pt=toCanvas(e.clientX,e.clientY),near=q=>q&&Math.hypot(pt.x-q.x,pt.y-q.y)<=bl.r*1.8;
  if(near(bl.undo))tapInfo.badge='undo';else if(near(bl.cancel))tapInfo.badge='cancel';
  else{if(ci===head)tapInfo.head=true;else if(ci===P[0]&&P.length>1)tapInfo.start=true;
   if(ci>=0&&ci!==head&&Logic.neighbors(level,head).includes(ci)&&Logic.legalNext(Logic.makeState(level,game.stitched,game.spools),P,ci,parked.spool.color))enterCell(ci)}}
 else{if(ci<0&&selected&&!selected.done)ci=nearestCell(e.clientX,e.clientY,i=>level.cells[i]===selected.color&&!game.stitched.has(i),.8);if(ci>=0)enterCell(ci)}
 if(useSwipe(e))showTip('swipe',"Tap a cell to start, then swipe anywhere.")});
canvas.addEventListener('pointermove',e=>{if(!dragging||screen!=='game')return;lastAction=performance.now();
 if(tapInfo&&!tapInfo.moved&&Math.hypot(e.clientX-tapInfo.x,e.clientY-tapInfo.y)>10)tapInfo.moved=true;
 let over=!!parked&&overRewind(e);if(over&&!rewHover)rewHover=performance.now();if(!over){rewHover=0;setRewind(false)}
 let x=e.clientX,y=e.clientY;
 if(useSwipe(e)&&parked){let dx=x-lastFinger.x,dy=y-lastFinger.y;lastFinger={x,y};swipeStep(dx,dy);
  if(parked){let hc=cellCenter(parked.path.at(-1));needle.px=hc.x+24;needle.py=hc.y-48}
  let el=Math.max(1,performance.now()-(lastPointer?lastPointer.t:performance.now()-16));audio.friction({speed:Math.hypot(dx,dy)/el*1000});lastPointer={x,y,t:performance.now()};return}
 if(!lastPointer)lastPointer={x,y,t:performance.now()};
 let dx=x-lastPointer.x,dy=y-lastPointer.y,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(dist/Math.max(4,view.cell*.18)));for(let k=1;k<=steps;k++)pointerAt(lastPointer.x+dx*k/steps,lastPointer.y+dy*k/steps);
 let elapsed=Math.max(1,performance.now()-lastPointer.t);audio.friction({speed:dist/elapsed*1000});needle.px=x+24;needle.py=y-48;lastPointer={x,y,t:performance.now()}});
function pointerUp(e){let up=e&&e.type==='pointerup',wasRewind=rewinding,now=performance.now();setRewind(false);
 if(up&&parked&&wasRewind&&rewHover&&now-rewHover>=220)unpickParked();
 else if(up&&parked&&tapInfo&&!tapInfo.moved&&now-tapInfo.t<300){if(tapInfo.badge==='cancel'||tapInfo.start)unpickParked();else if(tapInfo.badge==='undo'||tapInfo.head)pullBack()}
 rewHover=0;dragging=false;lastPointer=null;tapInfo=null;stepAcc=null;lastAction=performance.now();audio.friction({speed:0});updateUI();
 if(parked&&parked.path.length<parked.spool.length){parkedHints++;if(game.stuckLen!==parked.path.length)showTip('park',"Arrow: take back a stitch. Cross: remove the thread.")}}
canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);
$('tray').addEventListener('click',e=>{let btn=e.target.closest('[data-spool]');if(btn&&game&&screen==='game'){audio.init();let s=game.spools[+btn.dataset.spool];if(cutMode){if(cutOk(s))doCut(s,btn);return}selectSpool(s)}});
$('dbgBtn').onclick=()=>{audio.init();debugComplete()};$('hintBtn').onclick=()=>{audio.init();hint()};$('undoBtn').onclick=()=>{audio.init();undo()};$('cutBtn').onclick=()=>{audio.init();cutStart()};$('healBtn').onclick=()=>{audio.init();healUse()};$('scrim').onclick=cutCancel;document.addEventListener('keydown',e=>{if(e.key==='Escape')cutCancel()});$('minimap').onclick=()=>{if(screen!=='game'||!level.pic)return;let p=picOf(level);showPanel('<h1>'+p.name+'</h1><img class="bigpic" src="'+picImage(p,300,{sil:true,current:level.piece})+'" alt="'+p.name+'"><p class="small">'+doneCount(p)+' of '+p.count+' pieces stitched</p><button class="primary" data-act="close">'+ico('play')+'Back to stitching</button>')};$('tipOk').onclick=hideTip;$('settingsBtn').onclick=()=>{audio.init();if(screen==='game')gameMenu()};
$('overlay').addEventListener('click',e=>{let tb=e.target.closest('[data-tab]');if(tb){audio.init();play('ui');menuTab=tb.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tb));$('menuBody').innerHTML=menuBody();return}let pc=e.target.closest('[data-pic]');if(pc){audio.init();play('ui');tapestryPanel(pc.dataset.pic);return}let lv=e.target.closest('[data-level]');if(lv){audio.init();play('ui');startLevel(+lv.dataset.level);return}let b=e.target.closest('[data-act]');if(!b)return;audio.init();play('ui');switch(b.dataset.act){case'play':startLevel(continueLevel());break;case'levelsBack':if(levelsFrom==='game'&&game&&!game.complete){screen='game';hidePanel()}else title();break;case'restart':startLevel(level.number);break;case'collection':collection();break;case'settings':settingsPanel();break;case'close':hidePanel();if(screen==='title'||screen==='collection')title();break;case'title':if(fromGame&&game&&!game.complete){screen='game';gameMenu()}else title();break;case'home':title();break;case'debugwin':debugComplete();break;case'revive':revive();break;case'retry':startLevel(level.number);break;case'next':{let m=nextLevel(level.number);if(m&&unlocked(m))startLevel(m);else{menuTab=level.pic?'tap':'levels';title()}break}}});
document.addEventListener('change',e=>{let key=e.target.dataset.setting;if(!key)return;settings[key]=e.target.checked;persist();audio.mute();if(key==='ambience')audio.setAmbience();if(key==='reduced')app.classList.toggle('reduce',settings.reduced);if(key==='debugUnlock')updateDebugBtn();if(key==='symbols'){buildCache();if(game)updateUI()}});canvas.addEventListener('contextmenu',e=>e.preventDefault());
$('debug').addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='skip'){startLevel(Math.min(levels.length,level.number+1))}if(b.dataset.act==='export'){let data=JSON.stringify({stats,metrics:levels.map(l=>l.metrics)},null,2);navigator.clipboard?.writeText(data).catch(()=>{});console.log(data)}});
document.addEventListener('visibilitychange',()=>{if(audio.ctx){if(document.hidden)audio.ctx.suspend();else if(settings.sound)audio.ctx.resume()}if(document.hidden)audio.friction({speed:0})});window.addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);
function queueDemo(){demoQueue=[];for(const item of level.solution){let spool=game.spools.find(s=>!s.done&&s.color===item.color&&s.length===item.path.length&&!demoQueue.some(q=>q.spool===s));if(spool)demoQueue.push({spool,path:item.path})}clearTimeout(demoTimer);demoStep()}
function demoStep(){if(!DEMO||screen!=='game'||!demoQueue.length)return;let item=demoQueue[0];if(!parked){selected=item.spool;play('select');updateUI()}let index=parked?.path.length||0;if(index<item.path.length){enterCell(item.path[index]);demoTimer=setTimeout(demoStep,settings.reduced?90:190)}else{demoQueue.shift();demoTimer=setTimeout(demoStep,400)}}
function startup(){resize();for(const l of levels.slice(0,MINI)){let status=Logic.isSolvable(Logic.makeState(l),CONFIG.solverNodeLimit);if(status!=='solvable')throw Error(`Level ${l.number} is ${status}`)}console.table(levels.slice(0,MINI).map(l=>l.metrics=Logic.metrics(l,CONFIG.solverMetricCap)));if(DEMO)startLevel(1);else title();requestAnimationFrame(render)}
startup();
</script></body></html>

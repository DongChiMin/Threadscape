<script>
const CONFIG={hearts:3,hints:3,freeUndoPerLevel:3,freePeekPerLevel:1,coinBase:10,coinPerHeart:5,chestBonus:30,peekCost:20,autoCost:40,undoCost:10,hintCost:15,autoRunMs:55,heartOnDeadEnd:false,solverNodeLimit:200000,solverMetricCap:5000,solutionsCap:50,dprCap:2,particleCap:150,stitchMs:160,puckerMs:220,needleSpring:150,needleDamping:24,needleMagnet:.65,cameraZoom:1.04,frictionGain:.008,masterGain:.43,reverbWet:.12,voiceCap:12,stitchMinGap:30,ambienceGain:.008,winCardMs:1150,winFlyMs:1900,pitchScale:[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880],difficulty:[{from:1,to:5,colors:[2,3],spools:[1,2],targetReject:0},{from:6,to:15,colors:[3,5],spools:[2,3],targetReject:.3},{from:16,to:20,colors:[4,6],spools:[3,5],targetReject:.3}],flags:{ambience:false,particles:true}};
// BEGIN PURE LOGIC
const Logic=(()=>{
 // Pure game logic (no DOM). Source of truth; `node build.js` splices it into index.html.
 const COLORS='RGBYVPONTK'; // R coral, G leaf, B sky, Y sunflower, V violet, P pink, O orange, N brown, T teal, K charcoal
 const DIFFICULTY=[ // tunable: spools per color (kmin..kmax), min spool length, anchors/holes, candidates tried
  {to:5, minLen:2,prefLen:2,kmin:1,kmax:1,pre:0,   torn:0,cands:6},
  {to:15,minLen:2,prefLen:2,kmin:1,kmax:2,pre:.12, torn:0,cands:40},  // spec says 2-3 spools/color; bot showed that is too trap-heavy
  {to:20,minLen:1,prefLen:2,kmin:1,kmax:1,pre:.12, torn:3,cands:40}]; // spec 3-5; bot: >1 spool per region is brutal. L16+ may use 1-cell spools but they are penalised
 const GEN_NODE_LIMIT=20000, GEN_BOT_RUNS=40, DEAD_MAX=300000;
 const failTarget=n=>n<=5?0:Math.min(.28,.05+(n-6)*.016); // target bot fail rate (3 hearts): 5% at L6 rising to ~28% at L20
 const DEAD=new Set(); // known-unsolvable (w,cells,lengths) states; adjacency depends only on w, so it is level-independent

 function mulberry32(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
 const adjCache={};
 function adj(w,h){const k=w+'x'+h;if(adjCache[k])return adjCache[k];const A=[];for(let i=0;i<w*h;i++){const r=i/w|0,c=i%w,o=[];if(r>0)o.push(i-w);if(r<h-1)o.push(i+w);if(c>0)o.push(i-1);if(c<w-1)o.push(i+1);A.push(o)}return adjCache[k]=A}
 const neighbors=(level,i)=>adj(level.w,level.h)[i];
 const cell=(level,i)=>level.cells[i];
 function makeState(level,stitched=new Set(level.prestitch),spools=level.spools){return{level,stitched,spools}}
 function remaining(state,color){const out=[];state.level.cells.forEach((c,i)=>{if(c===color&&!state.stitched.has(i))out.push(i)});return out}
 function lengths(state,color){return state.spools.filter(s=>s.color===color&&!s.done).map(s=>s.length).sort((a,b)=>b-a)}
 function legalNext(state,path,i,color){return cell(state.level,i)===color&&!state.stitched.has(i)&&!path.includes(i)&&(!path.length||neighbors(state.level,path[path.length-1]).includes(i))}

 // ---- path enumeration ----
 // all simple paths of exactly L cells that END at s (s is the first cell)
 function enumFrom(A,rem,s,L,cb){const vis=new Uint8Array(rem.length),path=[s];vis[s]=1;let stop=false;
  (function go(){if(stop)return;if(path.length===L){if(cb(path))stop=true;return}
   for(const n of A[path[path.length-1]])if(rem[n]&&!vis[n]){vis[n]=1;path.push(n);go();path.pop();vis[n]=0;if(stop)return}})()}
 // all simple paths of exactly L cells that CONTAIN c (two arms, shorter arm first => each undirected path once, except equal arms twice)
 function enumThrough(A,rem,c,L,cb){const vis=new Uint8Array(rem.length),armA=[],armB=[];vis[c]=1;let stop=false;
  const walkB=(last,need)=>{if(stop)return;if(!need){if(cb(armA.slice().reverse().concat(c,armB)))stop=true;return}
   for(const n of A[last])if(rem[n]&&!vis[n]){vis[n]=1;armB.push(n);walkB(n,need-1);armB.pop();vis[n]=0;if(stop)return}};
  const walkA=(last,a)=>{if(stop)return;const b=L-1-a;if(a<=b)walkB(c,b);if(a>=b)return;
   for(const n of A[last])if(rem[n]&&!vis[n]){vis[n]=1;armA.push(n);walkA(n,a+1);armA.pop();vis[n]=0;if(stop)return}};
  walkA(c,0)}

 // ---- exact per-color solver ----
 function canSum(n,lens){const ok=new Uint8Array(n+1);ok[0]=1;for(const l of lens)for(let v=n-l;v>=0;v--)if(ok[v])ok[v+l]=1;return !!ok[n]}
 function feasible(A,rem,cs,lens){const seen=new Set();for(const f of cs){if(seen.has(f))continue;let size=0;const q=[f];seen.add(f);for(let k=0;k<q.length;k++){size++;for(const y of A[q[k]])if(rem[y]&&!seen.has(y)){seen.add(y);q.push(y)}}if(!canSum(size,lens))return false}return true}
 function anchorOf(A,rem,cs){let best=cs[0],bd=9;for(const c of cs){let d=0;for(const j of A[c])if(rem[j])d++;if(d<bd){bd=d;best=c}}return best}
 const without=(ls,k)=>ls.slice(0,k).concat(ls.slice(k+1));
 // partition `cells` into simple paths whose lengths equal multiset `lens`
 function solveCells(w,h,cells,lens,limit=200000){
  const A=adj(w,h),rem=new Uint8Array(w*h);cells=[...cells].sort((a,b)=>a-b);lens=[...lens].sort((a,b)=>b-a);
  if(cells.length!==lens.reduce((a,b)=>a+b,0))return{status:'unsolvable',paths:null,nodes:0};
  cells.forEach(c=>rem[c]=1);let nodes=0,unknown=false;const out=[];

   const key=w+':'+cs.join(',')+'|'+ls.join(',');if(DEAD.has(key))return false;

function overRewind(e){let b=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-spool]');return !!(b&&parked&&game.spools[+b.dataset.spool]===parked.spool)}
function setRewind(on){if(rewinding===on)return;rewinding=on;document.querySelectorAll('#tray .selected').forEach(b=>b.classList.toggle('rewind',on));if(on)play('select');$('instruction').textContent=on?'Release to rewind the thread onto its spool':instructionText()}
function anchorRel(e){let hc=toClient(cellCenter(parked.path.at(-1)));rel={fx:e.clientX,fy:e.clientY,vx:hc.x,vy:hc.y};lastPointer={x:hc.x,y:hc.y,t:performance.now()};needle.px=hc.x+24;needle.py=hc.y-48}
function pullBack(){if(!parked)return;if(parked.path.length<=1){unpickParked();return}let removed=parked.path.pop();stitchTimes.delete(removed);game.stuckLen=-1;play('unpick',{step:parked.path.length});vibrate(8);refreshBadges()}
// touch, nothing planted yet: the needle floats above the finger; resting on a thread-coloured cell for a moment plants it
function hoverPlant(){if(!rel||parked||!dragging||!lastPointer||!selected||selected.done||screen!=='game')return;let ci=pointerCell(lastPointer.x,lastPointer.y);
 if(ci<0||level.cells[ci]!==selected.color||game.stitched.has(ci)){dwell.cell=-1;return}
 let now=performance.now();if(dwell.cell!==ci){dwell={cell:ci,at:now};return}
 if(now-dwell.at>=DWELL_MS){dwell.cell=-1;enterCell(ci)}}
setInterval(()=>{if(dragging&&rel&&!parked)hoverPlant()},50);
canvas.addEventListener('pointerdown',e=>{if(screen!=='game'||DEMO)return;audio.init();canvas.setPointerCapture(e.pointerId);dragging=true;lastAction=performance.now();rel=null;dwell.cell=-1;inputType=e.pointerType;tapInfo={t:performance.now(),x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,head:false,moved:false};
 lastPointer={x:e.clientX,y:e.clientY,t:performance.now()};needle.px=e.clientX+24;needle.py=e.clientY-48;if(!parked){needle.x=needle.px;needle.y=needle.py;needle.vx=needle.vy=0}
 let ci=pointerCell(e.clientX,e.clientY);
 if(parked){let head=parked.path.at(-1);if(ci===head)tapInfo.head=true;
  if(ci>=0&&ci!==head&&Logic.neighbors(level,head).includes(ci)&&Logic.legalNext(Logic.makeState(level,game.stitched,game.spools),parked.path,ci,parked.spool.color))enterCell(ci)}
 else if(!useRel(e)){if(ci<0&&selected&&!selected.done)ci=nearestCell(e.clientX,e.clientY,i=>level.cells[i]===selected.color&&!game.stitched.has(i),.8);if(ci>=0)enterCell(ci)}
 if(useRel(e)){showTip('rel','Your needle floats above your finger so you always see it. Slide it onto a glowing ring and hold a moment to plant it.');
  if(parked)anchorRel(e);else{rel={fx:e.clientX,fy:e.clientY,vx:e.clientX,vy:e.clientY-tipD()};lastPointer={x:rel.vx,y:rel.vy,t:performance.now()};needle.px=rel.vx+24;needle.py=rel.vy-48;needle.x=needle.px;needle.y=needle.py;needle.vx=needle.vy=0}}});
canvas.addEventListener('pointermove',e=>{if(!dragging||screen!=='game')return;lastAction=performance.now();
 if(tapInfo){tapInfo.lx=e.clientX;tapInfo.ly=e.clientY;if(!tapInfo.moved&&Math.hypot(e.clientX-tapInfo.x,e.clientY-tapInfo.y)>10)tapInfo.moved=true}
 let over=!!parked&&overRewind(e);if(over&&!rewHover)rewHover=performance.now();if(!over)rewHover=0;setRewind(over);if(over){audio.friction({speed:0});return}
 let x=e.clientX,y=e.clientY;
 if(useRel(e)){if(!rel&&parked)anchorRel(e);if(rel){x=rel.vx+(e.clientX-rel.fx)*REL_GAIN;y=rel.vy+(e.clientY-rel.fy)*REL_GAIN;
   let m=view.cell*.9,c=toClient({x:view.gx-m,y:view.gy-m}),d=toClient({x:view.gx+level.w*view.cell+m,y:view.gy+level.h*view.cell+m}),cx=clamp(x,c.x,d.x),cy=clamp(y,c.y,d.y);
   if(cx!==x||cy!==y){rel.vx=cx-(e.clientX-rel.fx)*REL_GAIN;rel.vy=cy-(e.clientY-rel.fy)*REL_GAIN;x=cx;y=cy}
   if(!parked){lastPointer={x,y,t:performance.now()};needle.px=x+24;needle.py=y-48;hoverPlant();return}}}
 if(!lastPointer)lastPointer={x,y,t:performance.now()};
 let dx=x-lastPointer.x,dy=y-lastPointer.y,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(dist/Math.max(4,view.cell*.18)));for(let k=1;k<=steps;k++)pointerAt(lastPointer.x+dx*k/steps,lastPointer.y+dy*k/steps);
 let elapsed=Math.max(1,performance.now()-lastPointer.t);audio.friction({speed:dist/elapsed*1000});needle.px=x+24;needle.py=y-48;lastPointer={x,y,t:performance.now()}});
function pointerUp(e){let up=e&&e.type==='pointerup',wasRewind=rewinding;setRewind(false);
 if(up&&parked&&wasRewind&&rewHover&&performance.now()-rewHover>=220){unpickParked()}
 else if(up&&parked&&tapInfo&&tapInfo.head&&!tapInfo.moved&&performance.now()-tapInfo.t<280)pullBack();
 rewHover=0;dwell.cell=-1;dragging=false;lastPointer=null;rel=null;tapInfo=null;lastAction=performance.now();audio.friction({speed:0});updateUI();
 if(parked&&parked.path.length<parked.spool.length&&game.stuckLen!==parked.path.length)showTip('park','Needle parked. Drag to carry on – tap the needle to pull a stitch out, or drop the thread on its spool to rewind it.')}
canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);
$('tray').addEventListener('click',e=>{let btn=e.target.closest('[data-spool]');if(btn&&game&&screen==='game'){audio.init();selectSpool(game.spools[+btn.dataset.spool])}});
$('hintBtn').onclick=()=>{audio.init();hint()};$('undoBtn').onclick=()=>{audio.init();undo()};$('tipOk').onclick=hideTip;$('settingsBtn').onclick=()=>{audio.init();if(screen==='game')gameMenu()};
$('overlay').addEventListener('click',e=>{let tb=e.target.closest('[data-tab]');if(tb){audio.init();play('ui');menuTab=tb.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tb));$('menuBody').innerHTML=menuBody();return}let pc=e.target.closest('[data-pic]');if(pc){audio.init();play('ui');tapestryPanel(pc.dataset.pic);return}let lv=e.target.closest('[data-level]');if(lv){audio.init();play('ui');startLevel(+lv.dataset.level);return}let b=e.target.closest('[data-act]');if(!b)return;audio.init();play('ui');switch(b.dataset.act){case'play':startLevel(continueLevel());break;case'levelsBack':if(levelsFrom==='game'&&game&&!game.complete){screen='game';hidePanel()}else title();break;case'restart':startLevel(level.number);break;case'collection':collection();break;case'settings':settingsPanel();break;case'close':hidePanel();if(screen==='title'||screen==='collection')title();break;case'title':if(fromGame&&game&&!game.complete){screen='game';gameMenu()}else title();break;case'home':title();break;case'revive':revive();break;case'retry':startLevel(level.number);break;case'next':{let m=nextLevel(level.number);if(m&&unlocked(m))startLevel(m);else{menuTab=level.pic?'tap':'levels';title()}break}}});
document.addEventListener('change',e=>{let key=e.target.dataset.setting;if(!key)return;settings[key]=e.target.checked;persist();audio.mute();if(key==='ambience')audio.setAmbience();if(key==='reduced')app.classList.toggle('reduce',settings.reduced);if(key==='symbols'){buildCache();if(game)updateUI()}});canvas.addEventListener('contextmenu',e=>e.preventDefault());
$('debug').addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='skip'){startLevel(Math.min(levels.length,level.number+1))}if(b.dataset.act==='export'){let data=JSON.stringify({stats,metrics:levels.map(l=>l.metrics)},null,2);navigator.clipboard?.writeText(data).catch(()=>{});console.log(data)}});
document.addEventListener('visibilitychange',()=>{if(audio.ctx){if(document.hidden)audio.ctx.suspend();else if(settings.sound)audio.ctx.resume()}if(document.hidden)audio.friction({speed:0})});window.addEventListener('resize',resize);
function queueDemo(){demoQueue=[];for(const item of level.solution){let spool=game.spools.find(s=>!s.done&&s.color===item.color&&s.length===item.path.length&&!demoQueue.some(q=>q.spool===s));if(spool)demoQueue.push({spool,path:item.path})}clearTimeout(demoTimer);demoStep()}
function demoStep(){if(!DEMO||screen!=='game'||!demoQueue.length)return;let item=demoQueue[0];if(!parked){selected=item.spool;play('select');updateUI()}let index=parked?.path.length||0;if(index<item.path.length){enterCell(item.path[index]);demoTimer=setTimeout(demoStep,settings.reduced?90:190)}else{demoQueue.shift();demoTimer=setTimeout(demoStep,400)}}
function startup(){resize();for(const l of levels.slice(0,MINI)){let status=Logic.isSolvable(Logic.makeState(l),CONFIG.solverNodeLimit);if(status!=='solvable')throw Error(`Level ${l.number} is ${status}`)}console.table(levels.slice(0,MINI).map(l=>l.metrics=Logic.metrics(l,CONFIG.solverMetricCap)));if(DEMO)startLevel(1);else title();requestAnimationFrame(render)}
startup();
</script></body></html>
